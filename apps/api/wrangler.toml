# Not "bida": the Worker name is the hostname every shared group link points
# at, and the D1 name is where the ops already are. See hosting.md.
name = "hajsik"
main = "src/index.ts"
compatibility_date = "2026-08-27"

[assets]
directory = "../web/out"
binding = "ASSETS"
not_found_handling = "404-page"
# Everything else comes straight from the edge. **This list names everything
# the Worker handles — drop `/api/*` and the whole API 404s.** `/*.txt` is the
# RSC payloads, which the Worker redirects to their route (src/payload.ts).
run_worker_first = ["/api/*", "/*.txt"]

# docs/hosting.md#deploying.
[[d1_databases]]
binding = "DB"
database_name = "hajsik"
database_id = "809ab9d2-f6b3-4183-a9b1-8204848655f3"
migrations_dir = "migrations"

# Not a secret: the private half is `VAPID_PRIVATE_KEY`. Never rotate casually —
# a new pair silences every subscribed phone. docs/hosting.md#deploying.
[vars]
VAPID_PUBLIC_KEY = "BGRSigc1ntb1JLy-ofHZ7aI7D7KKMiwYSPwteG1M3b4dGkpK6Z1xhbz8g1uEK-jpx58r10_INma_-im1fTCD_CA"

# The dev Worker: own hostname and D1, deployed from `dev`. Environments inherit
# nothing, so [assets] and the binding are restated. Group links are
# same-origin, so dev can't reach production's data.
# docs/hosting.md#dev-and-production.
[env.dev]
name = "hajsik-dev"

[env.dev.assets]
directory = "../web/out"
binding = "ASSETS"
not_found_handling = "404-page"
# Dev only: every asset passes through the Worker for the DEV icons and top-bar
# tint (src/dev-env.ts).
run_worker_first = true

[env.dev.vars]
BIDA_ENV = "dev"
VAPID_PUBLIC_KEY = "BMU7v98iYPZXWTlYT0LV6ncbLuWa1Nd4cTKCfIqhNkcngTgHhDGF9Py7MJwV0K6JFKJlDmMy9E3orKu7leTaqVc"

# Disposable, unlike production — try schema changes here.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "hajsik-dev"
database_id = "add4467a-ebc2-43e5-800d-93cb3545fbbb"
migrations_dir = "migrations"
