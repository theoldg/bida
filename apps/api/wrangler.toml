# Not "bida": the Worker name is the hostname every shared group link points
# at, and the D1 name is where the ops already are. See hosting.md.
name = "hajsik"
main = "src/index.ts"
compatibility_date = "2026-08-27"

[assets]
directory = "../web/out"
binding = "ASSETS"
not_found_handling = "404-page"

# Created by `wrangler d1 create hajsik` — database_id filled in once that's
# run with a real Cloudflare token. See docs/hosting.md#deploying.
[[d1_databases]]
binding = "DB"
database_name = "hajsik"
database_id = "809ab9d2-f6b3-4183-a9b1-8204848655f3"
migrations_dir = "migrations"

# The dev Worker: its own hostname, its own D1, deployed from the `dev` branch.
# Wrangler environments inherit nothing — [assets] and the binding are restated
# here or the dev Worker ships without them. A group link is same-origin, so
# these two worlds cannot reach each other: a link made on dev only ever talks
# to `hajsik-dev`, and production's finished log is unreachable from here.
# docs/hosting.md#dev-and-production.
[env.dev]
name = "hajsik-dev"

[env.dev.assets]
directory = "../web/out"
binding = "ASSETS"
not_found_handling = "404-page"
# Dev only: every asset passes through the Worker, which serves the DEV-stamped
# icons and tags HTML so the top bar tints (src/dev-env.ts). Production serves
# assets straight from the edge, as before.
run_worker_first = true

[env.dev.vars]
BIDA_ENV = "dev"

# Created by `wrangler d1 create hajsik-dev` on 2026-09-14. Disposable, unlike
# the production database — this is the one a schema change gets tried on.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "hajsik-dev"
database_id = "add4467a-ebc2-43e5-800d-93cb3545fbbb"
migrations_dir = "migrations"
