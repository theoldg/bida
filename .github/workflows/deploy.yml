name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Public by nature — it identifies the Turnstile widget to Cloudflare and
      # is readable in the shipped bundle either way, so a repo *variable* and
      # not a secret. Unset, the build ships no Turnstile and the Worker must
      # have no TURNSTILE_SECRET_KEY either, or every scan is refused —
      # docs/receipt-scanning.md#what-the-scan-costs.
      - run: pnpm --filter @bida/web build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: pnpm --filter @bida/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
