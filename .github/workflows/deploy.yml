name: Deploy

# `dev` deploys to the dev Worker, `main` to production
# (docs/hosting.md#dev-and-production). Also callable: `release.yml` hands it the
# commit it just fast-forwarded `main` to, because a push made with the built-in
# `GITHUB_TOKEN` deliberately does not trigger another workflow — so the release
# button has to ask for the deploy rather than let the push cause one.
on:
  push:
    branches: [main, dev]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      target:
        type: string
        required: true # "dev" or "production"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'dev') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not a secret: a Turnstile *site* key identifies the widget in the page
      # source, and this one only works on the domains the widget names — both
      # hostnames are on that list, so one build serves either Worker. Here
      # rather than in a repo variable because this file is bida's own
      # deployment — the same place `wrangler.toml` hard-codes the Worker name
      # and the database id — and a variable someone forgets to set is a build
      # that ships no token to a Worker demanding one, which refuses every
      # scan. A fork changes it here, or exports the var to override it.
      # docs/receipt-scanning.md#what-the-scan-costs.
      - run: pnpm --filter @bida/web build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAEz1vIlldxKNntfQ
      - if: env.TARGET == 'dev'
        run: pnpm --filter @bida/api run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: env.TARGET == 'production'
        run: pnpm --filter @bida/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
