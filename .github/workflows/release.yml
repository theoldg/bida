name: Release dev to main

# The release button. Run it from anywhere — github.com → Actions → this
# workflow → "Run workflow" — and production becomes whatever `dev` is at.
# It is the owner's act ⁠(docs/standing-instructions.md#workflow); nothing else
# moves `main`.
#
# `--ff-only` is the whole safety story: it fails, loudly and without pushing,
# if `main` holds anything `dev` does not. That can only happen if someone
# committed straight to `main`, and the fix is to merge `main` into `dev` once.
on:
  workflow_dispatch:

#
# And only a commit dev has passed whole: `gate` pins dev's tip, waits for the
# run its push started, and refuses unless every job is green
# (scripts/release-gate.mjs). What it passed is exactly what is released, even
# if dev moves meanwhile.
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      # No pnpm here: the gate is node built-ins. v5 turns the package-manager
      # cache on by itself off `packageManager`, then fails looking for pnpm.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node scripts/release-gate.mjs "${{ steps.pin.outputs.sha }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  fast-forward:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.ff.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - id: ff
        run: |
          git fetch origin dev
          git merge --ff-only "${{ needs.gate.outputs.sha }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "released $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: fast-forward
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.fast-forward.outputs.sha }}
      target: production
    secrets: inherit
