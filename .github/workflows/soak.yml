name: Soak

# Experiment only — lives on the claude/ branch, never on dev. Runs the browser
# checks several rounds per runner at a given VERIFY_JOBS, without --retry, and
# pins one notice per runner with every round's per-check verdict and seconds.
on:
  push:
    branches: ["claude/**"]

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        jobs: [1, 2, 3, 4, 8]
        replica: [1, 2, 3, 4]
    env:
      WRANGLER_SEND_METRICS: "false"
      ROUNDS: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm --filter @bida/web build
      - name: soak
        env:
          VERIFY_JOBS: ${{ matrix.jobs }}
        run: |
          summary=""
          for r in $(seq 1 "$ROUNDS"); do
            start=$(date +%s)
            node scripts/verify.mjs > out.txt 2>&1 || true
            secs=$(( $(date +%s) - start ))
            cat out.txt
            line=$(grep -E '^(  ok  |FAIL  )' out.txt | head -20 | sed -E 's/ +/ /g' | tr '\n' ';')
            summary="${summary}R${r} ${secs}s | ${line}%0A"
            for f in $(grep -E '^FAIL  ' out.txt | head -20 | awk '{print $2}' | sort -u); do
              detail=$(awk -v n="$f" '$0 ~ "^──── "n" " {p=1; next} /^──── / {p=0} p' out.txt | grep -E '^(FAIL|    )' | head -6 | cut -c1-300 | sed 's/%/%25/g' | tr '\n' '|')
              summary="${summary}   ${f}: ${detail}%0A"
            done
          done
          echo "::notice title=soak jobs=${{ matrix.jobs }} replica=${{ matrix.replica }}::${summary}"
